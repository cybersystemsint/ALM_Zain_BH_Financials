#logging.file.name=D:/Files/TELKOM/ussdreceiver/Logs/ussd_receiver.log
logging.config=classpath:logback-spring.xml

# ----------------------------------------------------------------------
# Audit logging
# ----------------------------------------------------------------------
# Path of the rolling audit file (size + time based, 50 MB chunks,
# 60 days retained, 5 GB total cap, gz-compressed). Logback config
# lives in logback-spring.xml.
AUDIT_LOG_FILE=/home/app/logs/ALM/Assets/alm-audit.log

# Master switch: write audit events to MySQL (tb_AuditLog) IN ADDITION
# to the file? Default false — file is always written, DB is opt-in.
# We disabled DB persistence to stop tb_AuditLog from bloating the
# database (see AuditLogService Javadoc).
audit.persist.db=false
